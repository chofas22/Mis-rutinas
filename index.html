<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan de Recomposición Corporal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap');

        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .app-container {
            max-width: 450px;
            width: 100%;
            text-align: center;
        }

        .header h2 {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 0;
            color: #ffffff;
            letter-spacing: 2px;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin: 5px 0 0 0;
            color: #e87c3e;
            text-transform: uppercase;
        }

        .header p {
            font-size: 0.8rem;
            color: #888;
            margin: 8px 0 30px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .menu-btn {
            background-color: #2a2a2a;
            border: 1px solid #444;
            border-radius: 12px;
            padding: 22px 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: #ffffff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
        }

        .menu-btn:hover {
            border-color: #e87c3e;
            background-color: #221711;
        }

        .menu-info h3 {
            color: #e87c3e;
            font-size: 1.2rem;
            margin: 0 0 4px 0;
            text-transform: uppercase;
        }

        .menu-info p {
            font-size: 0.8rem;
            color: #bbb;
            margin: 0;
        }

        .arrow {
            color: #e87c3e;
            font-weight: bold;
            font-size: 1.4rem;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <h2>CONTROL PERSONAL</h2>
            <h1>FITNESS APP</h1>
            <p>Recomposición Corporal • 2026</p>
        </div>

        <!-- Botón para ir al submenú de Rutinas -->
        <a href="rutinas.html" class="menu-btn">
            <div class="menu-info" style="text-align: left;">
                <h3>Rutinas</h3>
                <p>Plan semanal de 5 días (Lunes a Viernes)</p>
            </div>
            <div class="arrow">→</div>
        </a>

        <!-- Botón para ir al apartado de Progreso -->
        <a href="progreso.html" class="menu-btn">
            <div class="menu-info" style="text-align: left;">
                <h3>Progreso</h3>
                <p>Registro de peso, gráfica y fotos de avance</p>
            </div>
            <div class="arrow">→</div>
        </a>
    </div>

</body>
</html>
