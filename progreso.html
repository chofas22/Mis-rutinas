<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progreso - Registro y Gráfica</title>
    <!-- Importamos Chart.js para la gráfica de peso -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap');

        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            max-width: 450px;
            width: 100%;
        }

        .back-btn {
            display: inline-block;
            color: #e87c3e;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            padding: 15px 0;
            border-bottom: 1px solid #222;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 800;
            margin: 5px 0 0 0;
            color: #e87c3e;
            text-transform: uppercase;
        }

        .section-title {
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            margin: 25px 0 15px 0;
            border-left: 4px solid #e87c3e;
            padding-left: 10px;
            text-transform: uppercase;
        }

        .card {
            background-color: #2a2a2a;
            border: 1px solid #444;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        label {
            font-size: 0.8rem;
            color: #bbb;
            display: block;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        input[type="date"], input[type="number"], input[type="file"] {
            width: 100%;
            padding: 12px;
            background-color: #161616;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        button {
            background-color: #e87c3e;
            color: #050505;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #ff8c4a;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .gallery img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #444;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <a href="index.html" class="back-btn">← Volver al Menú Principal</a>

        <div class="header">
            <h1>Seguimiento</h1>
            <p style="color: #888; font-size: 0.8rem; text-transform: uppercase; margin: 5px 0 0 0;">Peso y Fotos de Avance</p>
        </div>

        <!-- Gráfica de Progreso -->
        <div class="card">
            <h3 style="color: #e87c3e; margin-top: 0; font-size: 1rem; text-transform: uppercase;">Gráfica de Peso (kg)</h3>
            <canvas id="weightChart"></canvas>
        </div>

        <!-- Formulario de Registro -->
        <div class="card">
            <h3 style="color: #e87c3e; margin-top: 0; font-size: 1rem; text-transform: uppercase;">Nuevo Registro</h3>
            
            <label>Fecha</label>
            <input type="date" id="recordDate">

            <label>Peso Actual (kg)</label>
            <input type="number" id="recordWeight" step="0.1" placeholder="Ej. 65.5">

            <label>Foto de Avance (Usa tu cámara)</label>
            <!-- accept="image/*" y capture="environment" abren la cámara trasera directo en celulares -->
            <input type="file" id="recordPhoto" accept="image/*" capture="environment">

            <button onclick="saveRecord()">Guardar Registro</button>
        </div>

        <!-- Galería de Fotos Guardadas -->
        <div class="card">
            <h3 style="color: #e87c3e; margin-top: 0; font-size: 1rem; text-transform: uppercase;">Mis Fotos</h3>
            <div id="photoGallery" class="gallery">
                <!-- Las fotos subidas aparecerán aquí dinámicamente -->
            </div>
        </div>
    </div>

    <script>
        // Inicializar datos guardados en el navegador (LocalStorage)
        let progressData = JSON.parse(localStorage.getItem('fitness_progress')) || {
            dates: ['Sem 1', 'Sem 2', 'Sem 3'],
            weights: [66.0, 65.5, 65.0],
            photos: []
        };

        // Configurar la gráfica con Chart.js
        const ctx = document.getElementById('weightChart').getContext('2d');
        const weightChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: progressData.dates,
                datasets: [{
                    label: 'Peso (kg)',
                    data: progressData.weights,
                    borderColor: '#e87c3e',
                    backgroundColor: 'rgba(232, 124, 62, 0.1)',
                    borderWidth: 3,
                    fill: true,
                    tension: 0.3
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: false } },
                scales: {
                    x: { ticks: { color: '#888' }, grid: { color: '#222' } },
                    y: { ticks: { color: '#888' }, grid: { color: '#222' } }
                }
            }
        });

        // Función para guardar registros
        function saveRecord() {
            const dateInput = document.getElementById('recordDate').value;
            const weightInput = document.getElementById('recordWeight').value;
            const photoInput = document.getElementById('recordPhoto').files[0];

            if(!dateInput || !weightInput) {
                alert('Por favor ingresa al menos la fecha y tu peso.');
                return;
            }

            // Actualizar datos de la gráfica
            progressData.dates.push(dateInput);
            progressData.weights.push(parseFloat(weightInput));

            // Manejar la foto si se seleccionó
            if(photoInput) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    progressData.photos.push(e.target.result);
                    localStorage.setItem('fitness_progress', JSON.stringify(progressData));
                    location.reload(); // Recargar para actualizar vista
                };
                reader.readAsDataURL(photoInput);
            } else {
                localStorage.setItem('fitness_progress', JSON.stringify(progressData));
                location.reload();
            }
        }

        // Cargar galería guardada al abrir
        const galleryContainer = document.getElementById('photoGallery');
        if(progressData.photos && progressData.photos.length > 0) {
            progressData.photos.forEach(photoSrc => {
                const img = document.createElement('img');
                img.src = photoSrc;
                galleryContainer.appendChild(img);
            });
        } else {
            galleryContainer.innerHTML = '<p style="color: #666; font-size: 0.8rem; grid-column: span 2;">No hay fotos registradas aún.</p>';
        }
    </script>

</body>
</html>
