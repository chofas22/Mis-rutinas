<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Progreso - Registro y Gráfica</title>
    <!-- Importamos Chart.js para la gráfica de peso -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
        }

        .app-container {
            max-width: 450px;
            width: 100%;
        }

        .back-btn {
            display: inline-block;
            color: #e87c3e;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            padding: 15px 0;
            border-bottom: 1px solid #222;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 800;
            margin: 5px 0 0 0;
            color: #e87c3e;
            text-transform: uppercase;
        }

        .card {
            background-color: #2a2a2a;
            border: 1px solid #444;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            width: 100%;
        }

        /* Contenedor seguro para la gráfica en móvil */
        .chart-container {
            position: relative;
            width: 100%;
            max-height: 250px;
        }

        label {
            font-size: 0.8rem;
            color: #bbb;
            display: block;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        input[type="date"], input[type="number"], input[type="file"] {
            width: 100%;
            max-width: 100%;
            padding: 12px;
            background-color: #161616;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            margin-bottom: 15px;
        }

        button {
            background-color: #e87c3e;
            color: #050505;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #ff8c4a;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #161616;
            border: 1px solid #333;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 0.85rem;
            word-break: break-all;
        }

        .delete-btn {
            background-color: #a83232;
            color: #fff;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            width: auto;
            flex-shrink: 0;
            margin-left: 10px;
        }

        .delete-btn:hover {
            background-color: #c94040;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .gallery img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #444;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <a href="index.html" class="back-btn">← Volver al Menú Principal</a>

        <div class="header">
            <h1>Seguimiento</h1>
            <p style="color: #888; font-size: 0.8rem; text-transform: uppercase; margin: 5px 0 0 0;">Peso, Gráfica e Historial</p>
        </div>

        <!-- Gráfica de Progreso -->
        <div class="card">
            <h3 style="color: #e87c3e; margin-top: 0; font-size: 1rem; text-transform: uppercase;">Gráfica de Peso (kg)</h3>
            <div class="chart-container">
                <canvas id="weightChart"></canvas>
            </div>
        </div>

        <!-- Formulario de Registro -->
        <div class="card">
            <h3 style="color: #e87c3e; margin-top: 0; font-size: 1rem; text-transform: uppercase;">Nuevo Registro</h3>
            
            <label>Fecha</label>
            <input type="date" id="recordDate">

            <label>Peso Actual (kg)</label>
            <input type="number" id="recordWeight" step="0.1" placeholder="Ej. 65.5">

            <label>Foto de Avance (Usa tu cámara)</label>
            <input type="file" id="recordPhoto" accept="image/*" capture="environment">

            <button onclick="saveRecord()">Guardar Registro</button>
        </div>

        <!-- Historial y Gestión de Registros -->
        <div class="card">
            <h3 style="color: #e87c3e; margin-top: 0; font-size: 1rem; text-transform: uppercase;">Historial de Registros</h3>
            <div id="historyList">
                <!-- Se llenará dinámicamente -->
            </div>
        </div>

        <!-- Galería de Fotos Guardadas -->
        <div class="card">
            <h3 style="color: #e87c3e; margin-top: 0; font-size: 1rem; text-transform: uppercase;">Mis Fotos de Avance</h3>
            <div id="photoGallery" class="gallery">
                <!-- Se llenará dinámicamente -->
            </div>
        </div>
    </div>

    <script>
        // Inicia completamente vacío como lo solicitaste
        let records = JSON.parse(localStorage.getItem('fitness_records')) || [];

        function updateUI() {
            records.sort((a, b) => new Date(a.date) - new Date(b.date));

            const labels = records.map(r => r.date);
            const weights = records.map(r => r.weight);

            if (window.myChart) {
                window.myChart.destroy();
            }
            const ctx = document.getElementById('weightChart').getContext('2d');
            window.myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Peso (kg)',
                        data: weights,
                        borderColor: '#e87c3e',
                        backgroundColor: 'rgba(232, 124, 62, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { color: '#888', font: { size: 10 } }, grid: { color: '#222' } },
                        y: { ticks: { color: '#888', font: { size: 10 } }, grid: { color: '#222' } }
                    }
                }
            });

            // Actualizar Historial en pantalla
            const historyContainer = document.getElementById('historyList');
            historyContainer.innerHTML = '';
            
            if(records.length === 0) {
                historyContainer.innerHTML = '<p style="color: #666; font-size: 0.8rem; margin: 0;">No hay registros guardados.</p>';
            } else {
                records.forEach(r => {
                    const item = document.createElement('div');
                    item.className = 'history-item';
                    item.innerHTML = `
                        <span><strong>${r.date}</strong>: ${r.weight} kg</span>
                        <button class="delete-btn" onclick="deleteRecord(${r.id})">Eliminar</button>
                    `;
                    historyContainer.appendChild(item);
                });
            }

            // Actualizar Galería de Fotos
            const galleryContainer = document.getElementById('photoGallery');
            galleryContainer.innerHTML = '';
            const photosWithData = records.filter(r => r.photo != null);

            if(photosWithData.length > 0) {
                photosWithData.forEach(r => {
                    const img = document.createElement('img');
                    img.src = r.photo;
                    galleryContainer.appendChild(img);
                });
            } else {
                galleryContainer.innerHTML = '<p style="color: #666; font-size: 0.8rem; grid-column: span 2; margin: 0;">No hay fotos registradas aún.</p>';
            }
        }

        function saveRecord() {
            const dateInput = document.getElementById('recordDate').value;
            const weightInput = document.getElementById('recordWeight').value;
            const photoInput = document.getElementById('recordPhoto').files[0];

            if(!dateInput || !weightInput) {
                alert('Por favor ingresa al menos la fecha y tu peso.');
                return;
            }

            const newId = Date.now();

            if(photoInput) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    records.push({
                        id: newId,
                        date: dateInput,
                        weight: parseFloat(weightInput),
                        photo: e.target.result
                    });
                    localStorage.setItem('fitness_records', JSON.stringify(records));
                    updateUI();
                    clearForm();
                };
                reader.readAsDataURL(photoInput);
            } else {
                records.push({
                    id: newId,
                    date: dateInput,
                    weight: parseFloat(weightInput),
                    photo: null
                });
                localStorage.setItem('fitness_records', JSON.stringify(records));
                updateUI();
                clearForm();
            }
        }

        function deleteRecord(id) {
            if(confirm('¿Estás segura de eliminar este registro?')) {
                records = records.filter(r => r.id !== id);
                localStorage.setItem('fitness_records', JSON.stringify(records));
                updateUI();
            }
        }

        function clearForm() {
            document.getElementById('recordDate').value = '';
            document.getElementById('recordWeight').value = '';
            document.getElementById('recordPhoto').value = '';
        }

        updateUI();
    </script>

</body>
</html>
